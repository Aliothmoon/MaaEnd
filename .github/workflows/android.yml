name: build-android-apk

on:
  push:
    tags:
      - "v*"
    branches:
      - "v2"
    paths:
      - ".github/workflows/android.yml"
      - "Android/**"
      - "agent/**"
      - "tools/build_android_agents.py"
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "Android/**"
      - "agent/**"
      - "tools/build_android_agents.py"
  workflow_dispatch:
    inputs:
      assemble:
        description: "debug 只出 universal 调试包；release 出 universal / arm64-v8a / x86_64 三个包"
        type: choice
        options:
          - debug
          - release
        default: debug
      maafw_version:
        description: "MaaFramework release tag，留空与 install.yml 一致取最新 release"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # agent 交叉编译用的 NDK；MaaFwApp 自身的 native 部分由 AGP 按其默认版本自动下载
  AGENT_NDK_VERSION: "29.0.13599879"

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      assemble: ${{ steps.mode.outputs.assemble }}
      variants: ${{ steps.mode.outputs.variants }}
      tag: ${{ steps.mode.outputs.tag }}
      maafw_version: ${{ inputs.maafw_version || steps.maafw-latest-release.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            assemble="${{ inputs.assemble }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            assemble=release
          else
            assemble=debug
          fi

          # debug 只出 universal 验证两个 ABI 都能打包；release 额外出单 ABI 包
          if [[ "$assemble" == release ]]; then
            variants='["universal","arm64-v8a","x86_64"]'
          else
            variants='["universal"]'
          fi

          tag=$(git describe --tags --match "v*" HEAD 2>/dev/null || git rev-parse --short HEAD)

          echo "assemble=$assemble" | tee -a "$GITHUB_OUTPUT"
          echo "variants=$variants" | tee -a "$GITHUB_OUTPUT"
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"

      # 与 install.yml 保持一致：取 MaaFramework 最新 release
      - id: maafw-latest-release
        if: inputs.maafw_version == ''
        uses: step-security/github-action-get-latest-release@v0.8.2
        with:
          repository: MaaXYZ/MaaFramework
          excludes: "draft"
          token: ${{ secrets.GITHUB_TOKEN }}

  agents:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize MaaUtils submodule
        run: git submodule update --init --depth 1 agent/cpp-algo/MaaUtils

      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go-service/go.mod
          cache-dependency-path: |
            agent/go-service/go.mod
            agent/go-service/go.sum

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$AGENT_NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$AGENT_NDK_VERSION" >> "$GITHUB_ENV"

      - name: Cache MaaDeps
        uses: actions/cache@v5
        with:
          path: agent/cpp-algo/MaaUtils/MaaDeps
          key: maadeps-android-${{ matrix.abi }}-${{ hashFiles('tools/maadeps-download.py', 'agent/cpp-algo/MaaUtils/tools/maadeps_download.py') }}

      - name: Build agents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/build_android_agents.py \
            --ndk "$ANDROID_NDK_ROOT" \
            --abi ${{ matrix.abi }} \
            --maafw-version "${{ needs.meta.outputs.maafw_version }}" \
            --version "${{ needs.meta.outputs.tag }}"

      - name: Validate agent ELF files
        run: |
          readelf="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          machine=${{ matrix.abi == 'arm64-v8a' && 'AArch64' || 'X86-64' }}
          for elf in Android/agent-dist/${{ matrix.abi }}/jniLibs/*.so; do
            "$readelf" -h "$elf" | grep -q "Machine:.*$machine"
            "$readelf" -l "$elf" | grep -q "/system/bin/linker64"
            "$readelf" -d "$elf" | grep NEEDED
          done

      # 只含本 ABI，产物内布局为 <abi>/jniLibs/lib*.so，可直接合并进 agent-dist
      - uses: actions/upload-artifact@v6
        with:
          name: agent-dist-${{ matrix.abi }}
          path: Android/agent-dist
          if-no-files-found: error
          retention-days: 7

  apk:
    needs: [meta, agents]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.meta.outputs.variants) }}
    env:
      ASSEMBLE: ${{ needs.meta.outputs.assemble }}
      ABIS: ${{ matrix.variant == 'universal' && 'arm64-v8a,x86_64' || matrix.variant }}
    steps:
      # 版本号取自最外层仓库的 git describe / 提交数，需要完整历史
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize submodules
        run: git submodule update --init --depth 1 Android/MaaFwApp assets/resource/model

      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('Android/MaaFwApp/**/*.gradle.kts', 'Android/MaaFwApp/**/gradle-wrapper.properties', 'Android/MaaFwApp/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: actions/download-artifact@v7
        with:
          pattern: agent-dist-${{ matrix.variant == 'universal' && '*' || matrix.variant }}
          path: Android/agent-dist
          merge-multiple: true

      - name: Deploy MaaFramework
        working-directory: Android/MaaFwApp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/setup_maa_framework.py \
            --abi ${{ matrix.variant == 'universal' && 'all' || matrix.variant }} \
            --tag "${{ needs.meta.outputs.maafw_version }}"

      - name: Write local.properties
        working-directory: Android/MaaFwApp
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "pi.profile=../profile.yaml"
            echo "build.debugAbi=${ABIS}"
            echo "build.releaseAbi=${ABIS}"
          } > local.properties
          cat local.properties

      - name: Decode keystore
        id: keystore
        if: env.ASSEMBLE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::未配置 KEYSTORE_BASE64，release 包不签名"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: Android/MaaFwApp
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [[ "$ASSEMBLE" == release ]]; then
            ./gradlew --no-daemon assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      # universal 包不能带 ABI 标记：应用内更新按资产名选包，带标记会绕过 universal 回退
      - name: Rename APK
        run: |
          dir="Android/MaaFwApp/app/build/outputs/apk/$ASSEMBLE"
          count=$(find "$dir" -maxdepth 1 -name "*.apk" | wc -l)
          if [[ "$count" -ne 1 ]]; then
            echo "::error::预期恰好一个 APK，实际 $count 个"
            exit 1
          fi
          tag="${{ needs.meta.outputs.tag }}"
          name="MaaEnd-${tag//\//-}-${{ matrix.variant }}"
          [[ "$ASSEMBLE" == release ]] || name="$name-debug"
          mv "$dir"/*.apk "$dir/$name.apk"
          echo "APK_PATH=$dir/$name.apk" >> "$GITHUB_ENV"

      - name: Check APK native libraries
        run: |
          IFS=, read -ra abis <<< "$ABIS"
          for abi in "${abis[@]}"; do
            for lib in libcpp-algo.so libgo-service.so libMaaFramework.so libMaaAgentServer.so; do
              unzip -l "$APK_PATH" | grep -q "lib/$abi/$lib" || { echo "::error::$APK_PATH 缺少 lib/$abi/$lib"; exit 1; }
            done
          done

      - uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-android-${{ matrix.variant }}-${{ needs.meta.outputs.assemble }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload R8 mapping
        if: env.ASSEMBLE == 'release' && matrix.variant == 'universal'
        uses: actions/upload-artifact@v6
        with:
          name: MaaEnd-android-mapping
          path: Android/MaaFwApp/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
